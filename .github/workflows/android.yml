name: Build Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOCALVOICE_KEYSTORE_PATH: /tmp/localvoice-signing.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unit tests and source compilation
        run: ./gradlew :app:testDebugUnitTest :app:compileDebugKotlin --stacktrace
      - name: Restore permanent signing identity
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_SIGNING_KEYSTORE_BASE64 }}
          LOCALVOICE_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          LOCALVOICE_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEYSTORE_BASE64" || { echo 'Permanent signing key is required. APK publication is blocked; no replacement key will be generated.'; exit 1; }
          umask 077
          printf '%s' "$SIGNING_KEYSTORE_BASE64" | base64 --decode > "$LOCALVOICE_KEYSTORE_PATH"
          expected="$(tr -d '\r\n' < .github/signing-certificate.sha256)"
          actual="$(keytool -exportcert -alias "$LOCALVOICE_KEY_ALIAS" -keystore "$LOCALVOICE_KEYSTORE_PATH" -storepass:env LOCALVOICE_STORE_PASSWORD | sha256sum | cut -d ' ' -f1)"
          test "$actual" = "$expected" || { echo 'Signing identity mismatch; refusing to build APK.'; exit 1; }
          echo "Verified certificate SHA-256: $actual"
      - name: Build APK with verified signing key
        if: github.event_name != 'pull_request'
        env:
          LOCALVOICE_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          LOCALVOICE_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          LOCALVOICE_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug --no-configuration-cache --stacktrace
      - name: Verify APK signature and name APK
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk" | tee apk-signature.txt
          expected="$(tr -d '\r\n' < .github/signing-certificate.sha256)"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' apk-signature.txt | tr '[:upper:]' '[:lower:]')"
          test "$actual" = "$expected" || { echo 'APK signer mismatch; refusing to publish.'; exit 1; }
          cp "$apk" LocalVoiceInput-arm64.apk
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: LocalVoiceInput-arm64
          path: |
            LocalVoiceInput-arm64.apk
            apk-signature.txt
          if-no-files-found: error
          retention-days: 30
      - name: Publish signed APK to GitHub Releases
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          test -n "$version"
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; keeping published assets unchanged."
          else
            gh release create "$tag" LocalVoiceInput-arm64.apk apk-signature.txt \
              --target "$GITHUB_SHA" --title "$tag" --generate-notes --latest
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
      - name: Remove temporary signing file
        if: always()
        shell: python
        run: |
          import os
          from pathlib import Path
          Path(os.environ["LOCALVOICE_KEYSTORE_PATH"]).unlink(missing_ok=True)
